<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #FF8A50;
    --blue: #5AA9FF;
    --pink: #FF6FA5;
    --green: #4FD98A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:#F4F6FA;
    min-height:100vh;
    background:#0B0E17;
    overflow-x:hidden;
    position:relative;
  }

  /* Colorful blurred orbs drifting slowly behind the glass — this is what
     the glass panels refract, so the background needs real color and motion */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.55;
    z-index:0;
    will-change:transform;
  }
  .orb1{ width:420px; height:420px; background:var(--orange); top:-90px; left:-90px; animation: float1 22s ease-in-out infinite; }
  .orb2{ width:460px; height:460px; background:var(--blue); top:10%; right:-140px; animation: float2 26s ease-in-out infinite; }
  .orb3{ width:400px; height:400px; background:var(--pink); bottom:-120px; left:8%; animation: float3 24s ease-in-out infinite; }
  .orb4{ width:380px; height:380px; background:var(--green); bottom:-100px; right:6%; animation: float1 28s ease-in-out infinite reverse; }

  @keyframes float1{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(30px, 40px); }
  }
  @keyframes float2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-40px, 30px); }
  }
  @keyframes float3{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(35px, -25px); }
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:880px;
    margin:0 auto;
    padding:64px 24px 40px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }
  header h1{
    font-size:2rem;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:18px;
  }
  @media (max-width: 600px){
    .grid{grid-template-columns: 1fr;}
  }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    color:#F4F6FA;
    padding:22px;
    border-radius:22px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 8px 24px rgba(0,0,0,0.25);
    transition: transform .18s ease, background .18s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    background:rgba(255,255,255,0.12);
  }

  .card .icon{
    flex-shrink:0;
    width:50px;
    height:50px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .icon.i-orange{ background: linear-gradient(155deg, var(--orange), #E1652A); }
  .icon.i-blue{   background: linear-gradient(155deg, var(--blue), #2C74D6); }
  .icon.i-pink{   background: linear-gradient(155deg, var(--pink), #D63E7B); }
  .icon.i-green{  background: linear-gradient(155deg, var(--green), #24A85B); }

  .card .label{
    font-size:1.02rem;
    font-weight:600;
  }

  footer{
    text-align:center;
    margin-top:44px;
    font-size:0.78rem;
    color:rgba(244,246,250,0.55);
  }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="wrap">
    <header>
      <h1>Tools</h1>
    </header>

    <div class="grid">
      <a class="card" href="/idcard">
        <span class="icon i-orange">🪪</span>
        <span class="label">ID Card</span>
      </a>

      <a class="card" href="/pdf">
        <span class="icon i-blue">📄</span>
        <span class="label">Make PDF</span>
      </a>

      <a class="card" href="/pdf-resizer">
        <span class="icon i-pink">🗜️</span>
        <span class="label">Compress PDF</span>
      </a>

      <a class="card" href="/photo-resizer">
        <span class="icon i-green">🖼️</span>
        <span class="label">Compress Photo</span>
      </a>
    </div>

    <footer>Made by Amrit</footer>
  </div>
</body>
</html>
