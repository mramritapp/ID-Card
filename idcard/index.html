<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 ID Card Print Layout Studio - Free Size Mode</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #00F0FF;
      --accent-hover: #00C8D6;
      --bg-dark: #07090E;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -50px; left: -50px; }
    .orb-2 { width: 350px; height: 350px; background: rgba(138, 43, 226, 0.15); bottom: -50px; right: -50px; }

    header {
      position: relative;
      z-index: 10;
      height: 50px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(7, 9, 14, 0.6);
      backdrop-filter: blur(12px);
    }
    .app-title { font-size: 1rem; font-weight: 700; }
    .app-title span { color: var(--accent); }

    .main-layout {
      position: relative;
      z-index: 5;
      height: calc(100vh - 50px);
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 16px;
      padding: 16px;
    }

    .glass-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .upload-box {
      border: 1.5px dashed var(--panel-border);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      position: relative;
    }
    .upload-box:hover {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.04);
    }
    .upload-box input {
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      opacity: 0; cursor: pointer;
    }
    .upload-label { font-size: 0.75rem; font-weight: 600; }
    .upload-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    
    select, input[type="range"] {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }
    input[type="range"] {
      accent-color: var(--accent);
      padding: 0;
      height: 6px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--panel-border); }
    .btn-reset { background: rgba(255, 59, 48, 0.15); color: #FF453A; border: 1px solid rgba(255, 59, 48, 0.3); }
    .btn-reset:hover { background: rgba(255, 59, 48, 0.25); }

    .preview-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      position: relative;
    }

    .a4-page {
      width: 380px;
      height: 537px;
      background: #FFFFFF;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .cards-wrapper {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .id-card-img {
      object-fit: contain;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent;
    }

    /* Red Cropper Overlay Styling */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .cropper-container-wrapper {
      width: 85vw;
      height: 70vh;
      max-width: 800px;
      background: #000;
    }

    /* Red Color for Cropper Handles & Borders */
    .cropper-view-box { outline: 2px solid #FF0000 !important; }
    .cropper-line { background-color: #FF0000 !important; }
    .cropper-point { background-color: #FF0000 !important; width: 10px !important; height: 10px !important; opacity: 1 !important; }

    @media (max-width: 800px) {
      html, body { overflow: auto; height: auto; }
      .main-layout { grid-template-columns: 1fr; height: auto; }
      .preview-stage { height: 580px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="app-title">ID Card <span>Print Studio</span></div>
  </header>

  <div class="main-layout">
    
    <div class="glass-card">
      <div class="section-title">1. Upload Cards</div>
      <div class="upload-grid">
        <div class="upload-box" onclick="document.getElementById('frontInput').click()">
          <div class="upload-label">Front Side</div>
          <div class="upload-sub" id="frontStatus">Upload Photo</div>
          <input type="file" id="frontInput" accept="image/*" onclick="event.stopPropagation()">
        </div>
        <div class="upload-box" onclick="document.getElementById('backInput').click()">
          <div class="upload-label">Back Side</div>
          <div class="upload-sub" id="backStatus">Upload Photo</div>
          <input type="file" id="backInput" accept="image/*" onclick="event.stopPropagation()">
        </div>
      </div>

      <div class="section-title" style="margin-top: 4px;">2. Free Size Controls</div>

      <div class="control-group">
        <label>Card Orientation Preset</label>
        <select id="presetSelect">
          <option value="horizontal">Horizontal (Standard Aadhaar/PAN)</option>
          <option value="vertical" selected>Vertical (Voter ID Card)</option>
          <option value="custom">Custom Free Size</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Card Width</span><span id="cardWidthVal">54 mm</span></label>
        <input type="range" id="cardWidthSlider" min="20" max="180" value="54">
      </div>

      <div class="control-group">
        <label><span>Card Height</span><span id="cardHeightVal">85.6 mm</span></label>
        <input type="range" id="cardHeightSlider" min="20" max="180" value="85.6" step="0.1">
      </div>
      
      <div class="control-group">
        <label>Layout Arrangement</label>
        <select id="layoutSelect">
          <option value="side" selected>Side by Side</option>
          <option value="topdown">Top & Bottom (Upar-Niche)</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Card Gap</span><span id="gapVal">10 mm</span></label>
        <input type="range" id="gapSlider" min="0" max="100" value="10">
      </div>

      <div class="control-group">
        <label><span>Move Horizontal (X)</span><span id="posXVal">0 mm</span></label>
        <input type="range" id="posXSlider" min="-100" max="100" value="0">
      </div>

      <div class="control-group">
        <label><span>Move Vertical (Y)</span><span id="posYVal">0 mm</span></label>
        <input type="range" id="posYSlider" min="-100" max="100" value="0">
      </div>

      <button class="btn btn-reset" id="resetBtn">Reset Settings</button>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn btn-secondary" id="downloadJpgBtn">Ultra-HD JPG</button>
          <button class="btn btn-primary" id="downloadPdfBtn">Original PDF</button>
        </div>
      </div>
    </div>

    <div class="preview-stage">
      <div class="a4-page" id="a4Page">
        <div class="cards-wrapper" id="cardsWrapper">
          <img id="imgFrontPrev" class="id-card-img" style="display:none;" alt="Front">
          <img id="imgBackPrev" class="id-card-img" style="display:none;" alt="Back">
        </div>
      </div>
    </div>

  </div>

  <!-- Crop Modal -->
  <div class="modal" id="cropModal">
    <div class="cropper-container-wrapper">
      <img id="cropperImage" src="" style="max-width: 100%;">
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="cancelCropBtn" style="width: 100px;">Cancel</button>
      <button class="btn btn-primary" id="applyCropBtn" style="width: 140px;">Crop & Save</button>
    </div>
  </div>

  <script>
    const frontInput = document.getElementById('frontInput');
    const backInput = document.getElementById('backInput');
    const frontStatus = document.getElementById('frontStatus');
    const backStatus = document.getElementById('backStatus');
    
    const presetSelect = document.getElementById('presetSelect');
    const cardWidthSlider = document.getElementById('cardWidthSlider');
    const cardHeightSlider = document.getElementById('cardHeightSlider');
    const cardWidthVal = document.getElementById('cardWidthVal');
    const cardHeightVal = document.getElementById('cardHeightVal');

    const layoutSelect = document.getElementById('layoutSelect');
    const gapSlider = document.getElementById('gapSlider');
    const posXSlider = document.getElementById('posXSlider');
    const posYSlider = document.getElementById('posYSlider');

    const gapVal = document.getElementById('gapVal');
    const posXVal = document.getElementById('posXVal');
    const posYVal = document.getElementById('posYVal');

    const resetBtn = document.getElementById('resetBtn');

    const cardsWrapper = document.getElementById('cardsWrapper');
    const imgFrontPrev = document.getElementById('imgFrontPrev');
    const imgBackPrev = document.getElementById('imgBackPrev');

    const cropModal = document.getElementById('cropModal');
    const cropperImage = document.getElementById('cropperImage');
    const applyCropBtn = document.getElementById('applyCropBtn');
    const cancelCropBtn = document.getElementById('cancelCropBtn');

    let cropper = null;
    let activeSide = null;

    function handleFileSelect(file, side) {
      if (!file) return;
      activeSide = side;
      const reader = new FileReader();
      reader.onload = (e) => {
        cropperImage.src = e.target.result;
        cropModal.style.display = 'flex';
        
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropperImage, {
          viewMode: 1,
          dragMode: 'none',
          autoCropArea: 0.98,
          responsive: true,
          guides: true,
          center: true,
          highlight: false,
          cropBoxMovable: true,
          cropBoxResizable: true,
          toggleDragModeOnDblclick: false
        });
      };
      reader.readAsDataURL(file);
    }

    frontInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0], 'front'));
    backInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0], 'back'));

    cancelCropBtn.addEventListener('click', () => {
      cropModal.style.display = 'none';
      if (cropper) cropper.destroy();
      frontInput.value = '';
      backInput.value = '';
    });

    applyCropBtn.addEventListener('click', () => {
      if (!cropper) return;
      
      const canvas = cropper.getCroppedCanvas({
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });

      const croppedDataUrl = canvas.toDataURL('image/png', 1.0);

      if (activeSide === 'front') {
        imgFrontPrev.src = croppedDataUrl;
        imgFrontPrev.style.display = 'block';
        frontStatus.innerText = 'Uploaded ✓';
      } else {
        imgBackPrev.src = croppedDataUrl;
        imgBackPrev.style.display = 'block';
        backStatus.innerText = 'Uploaded ✓';
      }

      cropModal.style.display = 'none';
      cropper.destroy();
      updateLayout();
    });

    presetSelect.addEventListener('change', () => {
      if (presetSelect.value === 'vertical') {
        cardWidthSlider.value = 54;
        cardHeightSlider.value = 85.6;
        layoutSelect.value = 'side';
      } else if (presetSelect.value === 'horizontal') {
        cardWidthSlider.value = 85.6;
        cardHeightSlider.value = 54;
        layoutSelect.value = 'topdown';
      }
      updateLayout();
    });

    function updateLayout() {
      const cardW = parseFloat(cardWidthSlider.value);
      const cardH = parseFloat(cardHeightSlider.value);
      const isTopDown = layoutSelect.value === 'topdown';
      const gap = parseInt(gapSlider.value);
      const posX = parseInt(posXSlider.value);
      const posY = parseInt(posYSlider.value);

      cardWidthVal.innerText = `${cardW} mm`;
      cardHeightVal.innerText = `${cardH} mm`;
      gapVal.innerText = `${gap} mm`;
      posXVal.innerText = `${posX} mm`;
      posYVal.innerText = `${posY} mm`;

      const pxFactor = 380 / 210; // A4 Scale (380px = 210mm width)

      cardsWrapper.style.flexDirection = isTopDown ? 'column' : 'row';
      cardsWrapper.style.gap = `${gap * pxFactor}px`;

      const cardPxWidth = cardW * pxFactor;
      const cardPxHeight = cardH * pxFactor;

      [imgFrontPrev, imgBackPrev].forEach(img => {
        img.style.width = `${cardPxWidth}px`;
        img.style.height = `${cardPxHeight}px`;
      });

      // Calculate Center Alignment on A4 Canvas
      const wrapperWidth = isTopDown ? cardPxWidth : (cardPxWidth * 2 + gap * pxFactor);
      const wrapperHeight = isTopDown ? (cardPxHeight * 2 + gap * pxFactor) : cardPxHeight;

      const centerX = (380 - wrapperWidth) / 2;
      const centerY = (537 - wrapperHeight) / 2;

      cardsWrapper.style.left = `${centerX + (posX * pxFactor)}px`;
      cardsWrapper.style.top = `${centerY + (posY * pxFactor)}px`;
    }

    resetBtn.addEventListener('click', () => {
      presetSelect.value = 'vertical';
      cardWidthSlider.value = 54;
      cardHeightSlider.value = 85.6;
      layoutSelect.value = 'side';
      gapSlider.value = 10;
      posXSlider.value = 0;
      posYSlider.value = 0;
      updateLayout();
    });

    [cardWidthSlider, cardHeightSlider, layoutSelect, gapSlider, posXSlider, posYSlider].forEach(el => {
      el.addEventListener('input', () => {
        if (el === cardWidthSlider || el === cardHeightSlider) {
          presetSelect.value = 'custom';
        }
        updateLayout();
      });
    });

    // 0% Compression Output
    async function generateA4Canvas() {
      const page = document.getElementById('a4Page');
      return await html2canvas(page, {
        scale: 4,
        useCORS: true,
        logging: false,
        backgroundColor: '#FFFFFF'
      });
    }

    document.getElementById('downloadJpgBtn').addEventListener('click', async () => {
      const canvas = await generateA4Canvas();
      const link = document.createElement('a');
      link.download = 'Voter_ID_A4_Print.jpg';
      link.href = canvas.toDataURL('image/jpeg', 1.0);
      link.click();
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const canvas = await generateA4Canvas();
      const imgData = canvas.toDataURL('image/jpeg', 1.0);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      pdf.save('Voter_ID_A4_Print.pdf');
    });

    updateLayout();
  </script>
</body>
</html>
