<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 ID Card Print Layout Studio</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  
  <!-- Libraries: Cropper, html2canvas, jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #00F0FF;
      --accent-hover: #00C8D6;
      --bg-dark: #07090E;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Ambient Glow Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -50px; left: -50px; }
    .orb-2 { width: 350px; height: 350px; background: rgba(138, 43, 226, 0.15); bottom: -50px; right: -50px; }

    header {
      position: relative;
      z-index: 10;
      height: 50px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(7, 9, 14, 0.6);
      backdrop-filter: blur(12px);
    }
    .app-title { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
    .app-title span { color: var(--accent); }

    .main-layout {
      position: relative;
      z-index: 5;
      height: calc(100vh - 50px);
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 16px;
    }

    .glass-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .controls-panel {
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .upload-box {
      border: 1.5px dashed var(--panel-border);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      transition: all 0.2s;
      position: relative;
    }
    .upload-box:hover {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.04);
    }
    .upload-box input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-label { font-size: 0.75rem; font-weight: 600; color: var(--text-main); }
    .upload-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    
    select, input[type="range"] {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 8px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }
    input[type="range"] {
      accent-color: var(--accent);
      padding: 0;
      height: 6px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--panel-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.18); }

    /* Preview Canvas Area */
    .preview-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      position: relative;
    }

    /* Standard A4 Aspect Ratio Canvas Container */
    .a4-page {
      width: 380px;
      height: 537px; /* Maintains 210 x 297 mm Ratio */
      background: #FFFFFF;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .id-card-img {
      object-fit: contain;
      border: 1px dashed #ccc;
      background: #f8fafc;
    }

    /* Modal Styling for Cropper */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .cropper-container-wrapper {
      max-width: 80vw;
      max-height: 70vh;
      width: 600px;
      height: 400px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Cropper Line Visibility Override */
    .cropper-view-box {
      outline: 2px solid var(--accent) !important;
      outline-color: var(--accent) !important;
    }
    .cropper-line, .cropper-point {
      background-color: #FF0055 !important; /* High contrast pink/red for dark & light backgrounds */
      opacity: 0.9 !important;
    }
    .cropper-point.point-se {
      width: 8px !important;
      height: 8px !important;
    }

    @media (max-width: 800px) {
      html, body { overflow: auto; height: auto; }
      .main-layout { grid-template-columns: 1fr; height: auto; }
      .preview-stage { height: 580px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="app-title">ID Card <span>Print Studio</span></div>
  </header>

  <div class="main-layout">
    
    <!-- Controls -->
    <div class="glass-card controls-panel">
      <div class="section-title">1. Upload Cards</div>
      <div class="upload-grid">
        <div class="upload-box" onclick="document.getElementById('frontInput').click()">
          <div class="upload-label">Front Side</div>
          <div class="upload-sub" id="frontStatus">Click to Upload</div>
          <input type="file" id="frontInput" accept="image/*" onclick="event.stopPropagation()">
        </div>
        <div class="upload-box" onclick="document.getElementById('backInput').click()">
          <div class="upload-label">Back Side</div>
          <div class="upload-sub" id="backStatus">Click to Upload</div>
          <input type="file" id="backInput" accept="image/*" onclick="event.stopPropagation()">
        </div>
      </div>

      <div class="section-title" style="margin-top: 8px;">2. Print Layout</div>
      
      <div class="control-group">
        <label>Orientation Mode</label>
        <select id="layoutSelect">
          <option value="side">Side by Side</option>
          <option value="topdown" selected>Top & Bottom (Upar-Niche)</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Card Scale</span><span id="scaleVal">85 mm</span></label>
        <input type="range" id="scaleSlider" min="50" max="130" value="85">
      </div>

      <div class="control-group">
        <label><span>Card Gap</span><span id="gapVal">10 mm</span></label>
        <input type="range" id="gapSlider" min="0" max="50" value="10">
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="downloadJpgBtn">JPG</button>
        <button class="btn btn-primary" id="downloadPdfBtn">PDF (300 DPI)</button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div class="preview-stage">
      <div class="a4-page" id="a4Page">
        <div class="card-container" id="cardContainer">
          <img id="imgFrontPrev" class="id-card-img" style="display:none;" alt="Front">
          <img id="imgBackPrev" class="id-card-img" style="display:none;" alt="Back">
        </div>
      </div>
    </div>

  </div>

  <!-- Crop Modal -->
  <div class="modal" id="cropModal">
    <div class="cropper-container-wrapper">
      <img id="cropperImage" src="" style="max-width: 100%;">
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="cancelCropBtn" style="width: 100px;">Cancel</button>
      <button class="btn btn-primary" id="applyCropBtn" style="width: 140px;">Apply Crop</button>
    </div>
  </div>

  <script>
    // Elements
    const frontInput = document.getElementById('frontInput');
    const backInput = document.getElementById('backInput');
    const frontStatus = document.getElementById('frontStatus');
    const backStatus = document.getElementById('backStatus');
    
    const layoutSelect = document.getElementById('layoutSelect');
    const scaleSlider = document.getElementById('scaleSlider');
    const gapSlider = document.getElementById('gapSlider');
    const scaleVal = document.getElementById('scaleVal');
    const gapVal = document.getElementById('gapVal');

    const cardContainer = document.getElementById('cardContainer');
    const imgFrontPrev = document.getElementById('imgFrontPrev');
    const imgBackPrev = document.getElementById('imgBackPrev');

    const cropModal = document.getElementById('cropModal');
    const cropperImage = document.getElementById('cropperImage');
    const applyCropBtn = document.getElementById('applyCropBtn');
    const cancelCropBtn = document.getElementById('cancelCropBtn');

    let cropper = null;
    let activeSide = null; // 'front' or 'back'

    // Image Upload & Crop Trigger
    function handleFileSelect(file, side) {
      if (!file) return;
      activeSide = side;
      const reader = new FileReader();
      reader.onload = (e) => {
        cropperImage.src = e.target.result;
        cropModal.style.display = 'flex';
        
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropperImage, {
          viewMode: 1,
          autoCropArea: 0.9,
          responsive: true,
          restore: false
        });
      };
      reader.readAsDataURL(file);
    }

    frontInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0], 'front'));
    backInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0], 'back'));

    cancelCropBtn.addEventListener('click', () => {
      cropModal.style.display = 'none';
      if (cropper) cropper.destroy();
      frontInput.value = '';
      backInput.value = '';
    });

    applyCropBtn.addEventListener('click', () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });

      const croppedDataUrl = canvas.toDataURL('image/png');

      if (activeSide === 'front') {
        imgFrontPrev.src = croppedDataUrl;
        imgFrontPrev.style.display = 'block';
        frontStatus.innerText = 'Uploaded ✓';
      } else {
        imgBackPrev.src = croppedDataUrl;
        imgBackPrev.style.display = 'block';
        backStatus.innerText = 'Uploaded ✓';
      }

      cropModal.style.display = 'none';
      cropper.destroy();
      updateLayout();
    });

    // Layout Update & Boundaries Constraint Logic
    function updateLayout() {
      const isTopDown = layoutSelect.value === 'topdown';
      const gap = parseInt(gapSlider.value);
      let scale = parseInt(scaleSlider.value);

      // Max Constraints based on A4 aspect limits
      // Page display width: 380px, height: 537px
      const maxAllowedWidth = isTopDown ? 320 : 160; 
      const maxAllowedHeight = isTopDown ? 220 : 440;

      // Restrict scale value to prevent overflowing A4 page border
      if (scale * 3.2 > maxAllowedWidth) {
        scale = Math.floor(maxAllowedWidth / 3.2);
      }

      scaleVal.innerText = `${scale} mm`;
      gapVal.innerText = `${gap} mm`;

      cardContainer.style.flexDirection = isTopDown ? 'column' : 'row';
      cardContainer.style.gap = `${gap * 0.8}px`;

      // Standard ID Card Proportions (85.6mm x 54mm)
      const renderWidth = scale * 3.2; // Scaling factor for web A4 container
      const renderHeight = renderWidth * (54 / 85.6);

      [imgFrontPrev, imgBackPrev].forEach(img => {
        img.style.width = `${renderWidth}px`;
        img.style.height = `${renderHeight}px`;
      });
    }

    layoutSelect.addEventListener('change', updateLayout);
    scaleSlider.addEventListener('input', updateLayout);
    gapSlider.addEventListener('input', updateLayout);

    // Export Logic (300 DPI A4 Engine)
    async function generateA4Canvas() {
      const page = document.getElementById('a4Page');
      return await html2canvas(page, {
        scale: 3, // 3x High Definition Render
        useCORS: true,
        backgroundColor: '#FFFFFF'
      });
    }

    document.getElementById('downloadJpgBtn').addEventListener('click', async () => {
      const canvas = await generateA4Canvas();
      const link = document.createElement('a');
      link.download = 'A4_ID_Card_Print.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const canvas = await generateA4Canvas();
      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      const { jsPDF } = window.jspdf;
      // Exact ISO A4 dimensions (210mm x 297mm)
      const pdf = new jsPDF('p', 'mm', 'a4');
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
      pdf.save('A4_ID_Card_Print.pdf');
    });

    // Initial Trigger
    updateLayout();
  </script>
</body>
</html>
