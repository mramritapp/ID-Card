<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Maker - Cyber Cafe Tools</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #FF6FA5;
      --accent-hover: #ff5292;
      --bg-dark: #0B0E17;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.14);
      --text-main: #FFFFFF;
      --text-muted: #A0A5B5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: float 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: rgba(255, 111, 165, 0.25);
      top: -60px;
      left: -60px;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(90, 169, 255, 0.2);
      bottom: -100px;
      right: -80px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.08); }
    }

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 14, 23, 0.6);
      backdrop-filter: blur(12px);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .app-title span {
      color: var(--accent);
    }

    .main-container {
      position: relative;
      z-index: 5;
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      padding: 20px;
      min-height: 0;
    }

    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(22px) saturate(160%);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }

    .left-panel {
      overflow-y: auto;
    }

    .panel-heading {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-container {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0B0E17;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      border: 2px dashed rgba(255, 111, 165, 0.4);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-align: center;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .text-input, textarea, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0B0E17;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 15px rgba(255, 111, 165, 0.4);
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .preview-scroll-area {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 10px;
    }

    .preview-item {
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      max-width: 600px;
      width: 100%;
    }
    .preview-item img {
      width: 100%;
      display: block;
    }
    .preview-item-text {
      padding: 20px;
      color: #000;
      font-size: 0.95rem;
      white-space: pre-wrap;
      min-height: 300px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    @media (max-width: 860px) {
      html, body { overflow: auto; height: auto; }
      .main-container { grid-template-columns: 1fr; height: auto; }
      .preview-panel { height: 500px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <a href="../index.html" class="home-btn">← Home</a>
    <div class="app-title">PDF <span>Maker</span></div>
  </header>

  <div class="main-container">
    
    <div class="glass-panel left-panel">
      <div class="panel-heading">Create PDF</div>

      <div class="tab-container">
        <button class="tab-btn active" id="tabImages">Image to PDF</button>
        <button class="tab-btn" id="tabText">Text to PDF</button>
      </div>

      <!-- Mode 1: Image Mode -->
      <div id="imageModeSection">
        <div class="file-input-wrapper">
          <div style="font-size:0.9rem; font-weight:500;" id="uploadMsg">Select Images (PNG / JPG)</div>
          <input type="file" id="imageInput" accept="image/*" multiple>
        </div>
      </div>

      <!-- Mode 2: Text Mode -->
      <div id="textModeSection" style="display: none;">
        <div class="input-group">
          <label>Document Title</label>
          <input type="text" id="docTitle" class="text-input" placeholder="e.g. My Notes">
        </div>
        <div class="input-group" style="margin-top: 10px;">
          <label>Document Content</label>
          <textarea id="docContent" placeholder="Type or paste your text content here..."></textarea>
        </div>
      </div>

      <div class="input-group">
        <label>PDF File Name</label>
        <input type="text" id="fileNameInput" class="text-input" value="Document.pdf">
      </div>

      <div class="input-group">
        <label>Page Orientation</label>
        <select id="orientationSelect">
          <option value="p">Portrait</option>
          <option value="l">Landscape</option>
        </select>
      </div>

      <button class="btn" id="generatePdfBtn">Download PDF</button>
    </div>

    <!-- Right Preview Panel -->
    <div class="glass-panel preview-panel">
      <div class="panel-heading">Live Preview</div>
      <div class="preview-scroll-area" id="previewArea">
        <div style="color: var(--text-muted); margin: auto;">Add images or write text to see preview</div>
      </div>
    </div>

  </div>

  <script>
    const tabImages = document.getElementById('tabImages');
    const tabText = document.getElementById('tabText');
    const imageModeSection = document.getElementById('imageModeSection');
    const textModeSection = document.getElementById('textModeSection');
    const imageInput = document.getElementById('imageInput');
    const docTitle = document.getElementById('docTitle');
    const docContent = document.getElementById('docContent');
    const fileNameInput = document.getElementById('fileNameInput');
    const orientationSelect = document.getElementById('orientationSelect');
    const generatePdfBtn = document.getElementById('generatePdfBtn');
    const previewArea = document.getElementById('previewArea');

    let currentMode = 'image'; // 'image' or 'text'
    let imageFiles = [];

    // Switch Tabs
    tabImages.addEventListener('click', () => {
      currentMode = 'image';
      tabImages.classList.add('active');
      tabText.classList.remove('active');
      imageModeSection.style.display = 'block';
      textModeSection.style.display = 'none';
      renderPreview();
    });

    tabText.addEventListener('click', () => {
      currentMode = 'text';
      tabText.classList.add('active');
      tabImages.classList.remove('active');
      imageModeSection.style.display = 'none';
      textModeSection.style.display = 'block';
      renderPreview();
    });

    // Image Input Handle
    imageInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => {
            imageFiles.push(event.target.result);
            renderPreview();
          };
          reader.readAsDataURL(file);
        }
      });
    });

    docTitle.addEventListener('input', renderPreview);
    docContent.addEventListener('input', renderPreview);

    function renderPreview() {
      previewArea.innerHTML = '';

      if (currentMode === 'image') {
        if (imageFiles.length === 0) {
          previewArea.innerHTML = '<div style="color: var(--text-muted); margin: auto;">Add images to see preview</div>';
          return;
        }

        imageFiles.forEach((imgData, index) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'preview-item';
          
          const img = document.createElement('img');
          img.src = imgData;

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerText = 'Remove';
          delBtn.onclick = () => {
            imageFiles.splice(index, 1);
            renderPreview();
          };

          wrapper.appendChild(img);
          wrapper.appendChild(delBtn);
          previewArea.appendChild(wrapper);
        });

      } else {
        const title = docTitle.value.trim();
        const content = docContent.value.trim();

        if (!title && !content) {
          previewArea.innerHTML = '<div style="color: var(--text-muted); margin: auto;">Write text to see preview</div>';
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'preview-item';
        
        const textDiv = document.createElement('div');
        textDiv.className = 'preview-item-text';
        textDiv.innerHTML = `<h2>${title}</h2><br><p>${content}</p>`;

        wrapper.appendChild(textDiv);
        previewArea.appendChild(wrapper);
      }
    }

    // Generate PDF Logic
    generatePdfBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const orientation = orientationSelect.value;
      const pdf = new jsPDF(orientation, 'pt', 'a4');
      let filename = fileNameInput.value.trim() || 'document.pdf';
      if(!filename.endsWith('.pdf')) filename += '.pdf';

      if (currentMode === 'image') {
        if (imageFiles.length === 0) {
          alert('Please upload at least one image!');
          return;
        }

        imageFiles.forEach((imgData, idx) => {
          if (idx > 0) pdf.addPage();
          
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();

          pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
        });

        pdf.save(filename);

      } else {
        const title = docTitle.value.trim();
        const content = docContent.value.trim();

        if (!title && !content) {
          alert('Please write some content to export!');
          return;
        }

        const pageWidth = pdf.internal.pageSize.getWidth();
        let yPos = 40;

        if (title) {
          pdf.setFontSize(20);
          pdf.text(title, 40, yPos);
          yPos += 30;
        }

        if (content) {
          pdf.setFontSize(12);
          const lines = pdf.splitTextToSize(content, pageWidth - 80);
          pdf.text(lines, 40, yPos);
        }

        pdf.save(filename);
      }
    });
  </script>
</body>
</html>
