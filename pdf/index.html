<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #FF8A50;
    --blue: #5AA9FF;
    --pink: #FF6FA5;
    --green: #4FD98A;
    --accent: var(--blue);
    --accent-deep: #2C74D6;
    --ink: #F4F6FA;
    --ink-soft: rgba(244,246,250,0.58);
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.14);
    --danger: #FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:#0B0E17;
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    height:100%;
    overflow:hidden;
    position:relative;
  }
  @media (max-height:700px), (max-width:860px){
    html,body{ height:auto; overflow:auto; }
  }

  .orb{ position:fixed; border-radius:50%; filter:blur(80px); opacity:0.38; z-index:0; will-change:transform; }
  .orb1{ width:420px; height:420px; background:var(--blue); top:-100px; left:-100px; animation: float1 22s ease-in-out infinite; }
  .orb2{ width:460px; height:460px; background:var(--pink); top:8%; right:-150px; animation: float2 26s ease-in-out infinite; }
  .orb3{ width:400px; height:400px; background:var(--green); bottom:-130px; left:6%; animation: float3 24s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(30px,40px);} }
  @keyframes float2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,30px);} }
  @keyframes float3{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(35px,-25px);} }

  .wrap{
    position:relative;
    z-index:1;
    max-width:980px;
    height:100%;
    margin:0 auto;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
  }
  @media (max-height:700px), (max-width:860px){
    .wrap{ height:auto; min-height:100vh; padding:26px 20px 60px; }
  }

  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-shrink:0; }
  .home-pill{
    display:inline-block;
    text-decoration:none;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink);
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding:7px 14px;
    border-radius:999px;
    flex-shrink:0;
  }
  h1.page-title{
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }

  .layout{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap:20px;
    align-items:stretch;
    flex:1;
    min-height:0;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; align-items:start; }
  }
  .left-col{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
    min-height:0;
  }
  .right-col{
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  @media (max-width: 860px){
    .right-col{ min-height:300px; }
  }

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-radius:18px;
  }

  /* ---- Upload ---- */
  .upload-box{
    position:relative;
    padding:26px 10px;
    border:1.5px dashed var(--glass-border);
    border-radius:18px;
    background:var(--glass);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    text-align:center;
    flex-shrink:0;
    transition: border-color .15s ease;
  }
  .upload-box:hover{ border-color:var(--accent); }
  .upload-box input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-box .plus{ font-size:1.5rem; color:var(--ink-soft); line-height:1; }
  .upload-box .lbl{ font-size:0.85rem; font-weight:600; }

  /* ---- Margin control ---- */
  .controls-card{
    padding:16px;
    flex-shrink:0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .slider-label{
    display:flex; justify-content:space-between;
    font-size:0.8rem; margin-bottom:8px; color:var(--ink);
  }
  .slider-label span.val{ color:var(--accent); font-weight:700; }
  input[type="range"]{ width:100%; accent-color:var(--accent); }

  /* ---- Buttons ---- */
  .btn{
    width:100%; padding:13px; border-radius:13px; border:none;
    font-weight:700; font-size:0.85rem; cursor:pointer; flex-shrink:0;
  }
  .btn-primary{
    background:linear-gradient(155deg, var(--accent), var(--accent-deep));
    color:#fff;
    box-shadow:0 8px 20px rgba(90,169,255,0.3);
  }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .status-msg{
    text-align:center; font-size:0.78rem; color:var(--accent);
    margin:0; display:none; flex-shrink:0;
  }
  .status-msg.show{ display:block; }

  /* ---- Page list (right column) ---- */
  .list-header{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.78rem; font-weight:700; color:var(--accent);
    margin-bottom:10px; flex-shrink:0;
  }
  .list-box{
    flex:1;
    min-height:0;
    padding:12px;
    overflow-y:auto;
  }
  .empty-note{
    height:100%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:20px;
  }
  .page-item{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--glass-border);
    border-radius:12px;
    padding:8px;
    background:rgba(255,255,255,0.04);
  }
  .page-item + .page-item{ margin-top:8px; }
  .page-item .num{
    flex-shrink:0;
    width:24px; height:24px;
    border-radius:50%;
    background:linear-gradient(155deg, var(--accent), var(--accent-deep));
    color:#fff;
    font-size:0.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .page-item img{
    width:44px; height:58px;
    object-fit:cover;
    border-radius:6px;
    background:#fff;
    flex-shrink:0;
  }
  .page-item .name{
    flex:1; min-width:0;
    font-size:0.78rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink-soft);
  }
  .page-item .actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:28px; height:28px;
    border-radius:8px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.05);
    color:var(--ink);
    cursor:pointer;
    font-size:0.8rem;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .icon-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }
  .icon-btn:disabled{ opacity:0.3; cursor:not-allowed; }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrap">
  <div class="topbar">
    <a href="/" class="home-pill">← Home</a>
    <h1 class="page-title">Make PDF</h1>
  </div>

  <div class="layout">
    <div class="left-col">
      <label class="upload-box">
        <input type="file" accept="image/*" id="fileInput" multiple>
        <span class="plus">+</span>
        <span class="lbl">Add Photos</span>
      </label>

      <div class="glass controls-card">
        <div class="slider-label"><span>Margin</span><span class="val" id="marginVal">10 mm</span></div>
        <input type="range" id="marginSlider" min="0" max="25" value="10">
      </div>

      <button class="btn btn-primary" id="downloadBtn" disabled>Download PDF</button>
      <p class="status-msg" id="statusMsg"></p>
    </div>

    <div class="right-col glass">
      <div style="padding:14px 14px 0;">
        <div class="list-header"><span id="pageListTitle">Pages</span><span id="pageCount">0</span></div>
      </div>
      <div class="list-box" id="pageList">
        <p class="empty-note">No photos yet — add some to get started.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const fileInput = document.getElementById('fileInput');
  const pageList = document.getElementById('pageList');
  const pageCount = document.getElementById('pageCount');
  const downloadBtn = document.getElementById('downloadBtn');
  const marginSlider = document.getElementById('marginSlider');
  const marginVal = document.getElementById('marginVal');

  let images = []; // { id, name, dataUrl }
  let counter = 0;
  let marginMM = 10;

  marginSlider.addEventListener('input', ()=>{
    marginMM = parseInt(marginSlider.value);
    marginVal.textContent = marginMM + ' mm';
  });

  fileInput.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = (ev)=>{
        images.push({ id: ++counter, name: file.name, dataUrl: ev.target.result });
        renderList();
      };
      reader.readAsDataURL(file);
    });
    fileInput.value = ''; // allow re-selecting same file later
  });

  function renderList(){
    pageCount.textContent = images.length;
    if(images.length === 0){
      pageList.innerHTML = '<p class="empty-note">No photos yet — add some to get started.</p>';
      downloadBtn.disabled = true;
      return;
    }
    downloadBtn.disabled = false;
    pageList.innerHTML = '';
    images.forEach((img, idx)=>{
      const item = document.createElement('div');
      item.className = 'page-item';

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = idx + 1;
      item.appendChild(num);

      const thumb = document.createElement('img');
      thumb.src = img.dataUrl;
      item.appendChild(thumb);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = img.name;
      item.appendChild(name);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn';
      upBtn.textContent = '↑';
      upBtn.disabled = idx === 0;
      upBtn.addEventListener('click', ()=>{
        [images[idx-1], images[idx]] = [images[idx], images[idx-1]];
        renderList();
      });
      actions.appendChild(upBtn);

      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn';
      downBtn.textContent = '↓';
      downBtn.disabled = idx === images.length - 1;
      downBtn.addEventListener('click', ()=>{
        [images[idx+1], images[idx]] = [images[idx], images[idx+1]];
        renderList();
      });
      actions.appendChild(downBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', ()=>{
        images.splice(idx, 1);
        renderList();
      });
      actions.appendChild(delBtn);

      item.appendChild(actions);
      pageList.appendChild(item);
    });
  }

  function showStatus(msg){
    const s = document.getElementById('statusMsg');
    s.textContent = msg;
    s.classList.add('show');
    setTimeout(()=>{ s.classList.remove('show'); }, 3500);
  }

  // Detects the real image format from the data URL so jsPDF embeds the
  // ORIGINAL bytes untouched — no re-encoding, so no quality/size loss.
  function detectFormat(dataUrl){
    const match = dataUrl.match(/^data:image\/(\w+);/i);
    if(!match) return 'JPEG';
    const ext = match[1].toLowerCase();
    if(ext === 'png') return 'PNG';
    if(ext === 'webp') return 'WEBP';
    return 'JPEG';
  }

  downloadBtn.addEventListener('click', ()=>{
    if(images.length === 0) return;
    showStatus('Preparing PDF...');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const PAGE_W = 210, PAGE_H = 297;
    const availW = PAGE_W - marginMM * 2;
    const availH = PAGE_H - marginMM * 2;

    images.forEach((img, idx)=>{
      if(idx > 0) pdf.addPage('a4', 'p');
      const format = detectFormat(img.dataUrl);
      let props;
      try{
        props = pdf.getImageProperties(img.dataUrl);
      }catch(e){
        props = { width: 1, height: 1.414 }; // fallback A4-ish ratio
      }
      const ratio = Math.min(availW / props.width, availH / props.height);
      const w = props.width * ratio;
      const h = props.height * ratio;
      const x = (PAGE_W - w) / 2;
      const y = (PAGE_H - h) / 2;
      pdf.addImage(img.dataUrl, format, x, y, w, h);
    });

    pdf.save('document.pdf');
    showStatus('PDF downloaded.');
  });

})();
</script>
</body>
</html>
