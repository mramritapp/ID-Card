<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to PDF Maker - Cyber Cafe Tools</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #FF6FA5;
      --accent-hover: #ff5292;
      --bg-dark: #0B0E17;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.14);
      --text-main: #FFFFFF;
      --text-muted: #A0A5B5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: float 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: rgba(255, 111, 165, 0.25);
      top: -60px;
      left: -60px;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(90, 169, 255, 0.2);
      bottom: -100px;
      right: -80px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.08); }
    }

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 14, 23, 0.6);
      backdrop-filter: blur(12px);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .app-title span {
      color: var(--accent);
    }

    .main-container {
      position: relative;
      z-index: 5;
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      padding: 20px;
      min-height: 0;
    }

    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(22px) saturate(160%);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }

    .left-panel {
      overflow-y: auto;
    }

    .panel-heading {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      border: 2px dashed rgba(255, 111, 165, 0.4);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover {
      border-color: var(--accent);
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .text-input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .slider-input {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0B0E17;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 15px rgba(255, 111, 165, 0.4);
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .preview-grid-container {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      padding: 10px;
      align-content: start;
    }

    .grid-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      cursor: grab;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      height: 240px;
    }
    .grid-card:active {
      cursor: grabbing;
    }
    .grid-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
      border: 2px dashed var(--accent);
    }

    .image-frame {
      width: 100%;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      box-sizing: border-box;
      transition: padding 0.1s ease;
    }

    .image-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      background: #fff;
    }

    .card-footer {
      width: 100%;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .file-name {
      font-size: 0.78rem;
      color: #333333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-btn {
      background: #ff4d4d;
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .delete-btn:hover {
      background: #e60000;
    }

    .placeholder-msg {
      color: var(--text-muted);
      grid-column: 1 / -1;
      text-align: center;
      margin: auto;
    }

    @media (max-width: 860px) {
      html, body { overflow: auto; height: auto; }
      .main-container { grid-template-columns: 1fr; height: auto; }
      .preview-panel { height: 500px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <a href="../index.html" class="home-btn">← Home</a>
    <div class="app-title">Image to PDF <span>Maker</span></div>
  </header>

  <div class="main-container">
    
    <!-- Control Panel -->
    <div class="glass-panel left-panel">
      <div class="panel-heading">Upload & Settings</div>

      <div class="file-input-wrapper">
        <div style="font-size:0.9rem; font-weight:500;" id="uploadMsg">+ Select or Drop Images</div>
        <input type="file" id="imageInput" accept="image/*" multiple>
      </div>

      <div class="input-group">
        <label>PDF File Name</label>
        <input type="text" id="fileNameInput" class="text-input" value="Document.pdf">
      </div>

      <div class="input-group">
        <label>PDF Mode</label>
        <select id="pdfModeSelect">
          <option value="original" selected>Original Image Size</option>
          <option value="margin">Custom Margin Size</option>
        </select>
      </div>

      <!-- Margin Controls -->
      <div class="input-group" id="marginGroup" style="display: none;">
        <label>
          <span>Page Margin</span>
          <span id="marginVal">15 px</span>
        </label>
        <input type="range" id="marginSlider" class="slider-input" min="0" max="100" value="15">
      </div>

      <!-- File Size Compression Controls -->
      <div class="input-group">
        <label>
          <span>Image Quality (Compression)</span>
          <span id="qualityVal">40% (Low MB)</span>
        </label>
        <input type="range" id="qualitySlider" class="slider-input" min="10" max="100" value="40">
      </div>

      <button class="btn" id="generatePdfBtn">Download PDF</button>
    </div>

    <!-- Right Preview Panel -->
    <div class="glass-panel preview-panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="panel-heading">Image Preview</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Drag photos to reorder</div>
      </div>
      
      <div class="preview-grid-container" id="previewContainer">
        <div class="placeholder-msg">Uploaded images will appear here</div>
      </div>
    </div>

  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const fileNameInput = document.getElementById('fileNameInput');
    const pdfModeSelect = document.getElementById('pdfModeSelect');
    const marginGroup = document.getElementById('marginGroup');
    const marginSlider = document.getElementById('marginSlider');
    const marginVal = document.getElementById('marginVal');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const generatePdfBtn = document.getElementById('generatePdfBtn');
    const previewContainer = document.getElementById('previewContainer');

    let imageList = [];
    let draggedIndex = null;

    pdfModeSelect.addEventListener('change', () => {
      if (pdfModeSelect.value === 'margin') {
        marginGroup.style.display = 'flex';
      } else {
        marginGroup.style.display = 'none';
      }
      applyMarginPreview();
    });

    marginSlider.addEventListener('input', (e) => {
      marginVal.innerText = `${e.target.value} px`;
      applyMarginPreview();
    });

    qualitySlider.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val < 40) {
        qualityVal.innerText = `${val}% (Ultra Small)`;
      } else if (val < 70) {
        qualityVal.innerText = `${val}% (Low MB - Recommended)`;
      } else {
        qualityVal.innerText = `${val}% (High Quality/Large MB)`;
      }
    });

    function applyMarginPreview() {
      const margin = pdfModeSelect.value === 'margin' ? parseInt(marginSlider.value) / 3 : 0;
      const frames = document.querySelectorAll('.image-frame');
      frames.forEach(frame => {
        frame.style.padding = `${margin}px`;
      });
    }

    imageInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      let loadedCount = 0;

      files.forEach((file) => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              imageList.push({
                id: Date.now() + Math.random(),
                dataUrl: event.target.result,
                name: file.name,
                width: img.naturalWidth,
                height: img.naturalHeight,
                rawImg: img
              });
              loadedCount++;
              if (loadedCount === files.length) {
                renderGrid();
              }
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
      imageInput.value = '';
    });

    function renderGrid() {
      previewContainer.innerHTML = '';

      if (imageList.length === 0) {
        previewContainer.innerHTML = '<div class="placeholder-msg">Uploaded images will appear here</div>';
        return;
      }

      const currentPadding = pdfModeSelect.value === 'margin' ? parseInt(marginSlider.value) / 3 : 0;

      imageList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="image-frame" style="padding: ${currentPadding}px;">
            <img src="${item.dataUrl}" alt="${item.name}">
          </div>
          <div class="card-footer">
            <span class="file-name" title="${item.name}">${item.name}</span>
            <button class="delete-btn" onclick="removeImage(${index})">✕</button>
          </div>
        `;

        card.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedIndex = null;
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIndex = parseInt(card.dataset.index);
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const movedItem = imageList.splice(draggedIndex, 1)[0];
            imageList.splice(targetIndex, 0, movedItem);
            renderGrid();
          }
        });

        previewContainer.appendChild(card);
      });
    }

    window.removeImage = function(index) {
      imageList.splice(index, 1);
      renderGrid();
    };

    // Helper: Compress Image to Canvas with Max Width Limit & JPEG Compression
    function compressImage(imgObj, qualityFactor) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // Max width threshold to avoid huge resolutions like 4K/8K
      const MAX_WIDTH = 1200;
      let width = imgObj.width;
      let height = imgObj.height;

      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;

      // Fill white background for transparent PNGs
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      ctx.drawImage(imgObj.rawImg, 0, 0, width, height);

      return {
        compressedDataUrl: canvas.toDataURL('image/jpeg', qualityFactor),
        width: width,
        height: height
      };
    }

    // Export Compressed PDF
    generatePdfBtn.addEventListener('click', () => {
      if (imageList.length === 0) {
        alert('Please upload at least one image!');
        return;
      }

      generatePdfBtn.innerText = 'Compressing & Downloading...';
      generatePdfBtn.disabled = true;

      setTimeout(() => {
        const { jsPDF } = window.jspdf;
        const mode = pdfModeSelect.value;
        const margin = mode === 'margin' ? parseInt(marginSlider.value) : 0;
        const quality = parseInt(qualitySlider.value) / 100; // e.g. 0.40
        
        let filename = fileNameInput.value.trim() || 'Document.pdf';
        if (!filename.endsWith('.pdf')) filename += '.pdf';

        let pdf = null;

        imageList.forEach((item, idx) => {
          const compressed = compressImage(item, quality);
          
          const totalWidth = compressed.width + (margin * 2);
          const totalHeight = compressed.height + (margin * 2);
          const orientation = totalWidth > totalHeight ? 'l' : 'p';

          if (idx === 0) {
            pdf = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [totalWidth, totalHeight]
            });
          } else {
            pdf.addPage([totalWidth, totalHeight], orientation);
          }

          pdf.addImage(compressed.compressedDataUrl, 'JPEG', margin, margin, compressed.width, compressed.height);
        });

        pdf.save(filename);

        generatePdfBtn.innerText = 'Download PDF';
        generatePdfBtn.disabled = false;
      }, 100);
    });
  </script>
</body>
</html>
