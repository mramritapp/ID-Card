<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Resizer Pro - Cyber Cafe Tools</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #FF6FA5;
      --accent-hover: #ff5292;
      --accent-glow: rgba(255, 111, 165, 0.35);
      --bg-dark: #0B0E17;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(0, 0, 0, 0.35);
      --text-main: #FFFFFF;
      --text-muted: #A0A5B5;
      --success: #4FD98A;
      --danger: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    header {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 14, 23, 0.7);
      backdrop-filter: blur(16px);
    }

    .home-btn {
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .app-title span {
      color: var(--accent);
    }

    .main-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      min-height: calc(100vh - 64px);
    }

    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .file-input-wrapper {
      position: relative;
      padding: 32px 20px;
      border: 2px dashed rgba(255, 111, 165, 0.35);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .target-size-row {
      display: flex;
      gap: 12px;
    }

    .text-input, .unit-select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      color: #FFF;
      outline: none;
    }

    .text-input { flex: 1; }

    .file-info-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); color: #0B0E17; }
    .btn-success { background: var(--success); color: #0B0E17; }

    /* PREVIEW CONTAINER FIX - NO SHRINKING */
    .preview-panel {
      width: 100%;
    }

    .preview-scroll-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .page-preview-card {
      width: 100%;
      max-width: 800px;
      background: #FFFFFF;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .page-preview-card canvas, 
    .page-preview-card img {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: contain;
    }

    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="home-btn">← Home</a>
    <div class="app-title">PDF <span>Resizer Pro</span></div>
  </header>

  <div class="main-container">
    <div class="glass-panel">
      <div class="panel-heading">Upload & Compress</div>

      <div class="file-input-wrapper">
        <div id="uploadText">Select PDF File</div>
        <input type="file" id="pdfFileInput" accept="application/pdf">
      </div>

      <div class="input-group">
        <label>Target Maximum File Size</label>
        <div class="target-size-row">
          <input type="number" id="targetSizeInput" class="text-input" value="200">
          <select id="unitSelect" class="unit-select">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>
      </div>

      <div class="file-info-box" id="infoBox" style="display: none;">
        <div class="info-item"><span>Original Size:</span><span id="origSizeText">-</span></div>
        <div class="info-item"><span>Total Pages:</span><span id="pageCountText">-</span></div>
        <div class="info-item" id="resultRow" style="display: none;">
          <span style="color: var(--accent);">Compressed Size:</span>
          <span id="compressedSizeText" style="color: var(--accent);">-</span>
        </div>
      </div>

      <button class="btn btn-primary" id="compressBtn" disabled>Process & Compress PDF</button>
      <button class="btn btn-success" id="downloadBtn" style="display: none;">Download Compressed PDF</button>
      <div id="statusText" style="font-size: 0.85rem; text-align: center; color: var(--text-muted);">Select a PDF file</div>
    </div>

    <div class="glass-panel preview-panel">
      <div class="panel-heading">Document Preview</div>
      <div class="preview-scroll-area" id="previewArea"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfFileInput = document.getElementById('pdfFileInput');
    const uploadText = document.getElementById('uploadText');
    const targetSizeInput = document.getElementById('targetSizeInput');
    const unitSelect = document.getElementById('unitSelect');
    const infoBox = document.getElementById('infoBox');
    const origSizeText = document.getElementById('origSizeText');
    const pageCountText = document.getElementById('pageCountText');
    const resultRow = document.getElementById('resultRow');
    const compressedSizeText = document.getElementById('compressedSizeText');
    const compressBtn = document.getElementById('compressBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const previewArea = document.getElementById('previewArea');

    let currentFile = null;
    let pdfDoc = null;
    let compressedPdfBlob = null;

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    pdfFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') return;

      currentFile = file;
      uploadText.textContent = file.name;
      origSizeText.textContent = formatBytes(file.size);
      
      infoBox.style.display = 'flex';
      resultRow.style.display = 'none';
      downloadBtn.style.display = 'none';
      compressBtn.disabled = true;

      try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        pageCountText.textContent = pdfDoc.numPages;

        previewArea.innerHTML = '';
        
        // Render High Clarity Preview (Fixed Scale 2.0 for sharp rendering)
        for (let pageNum = 1; pageNum <= Math.min(pdfDoc.numPages, 5); pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 2.0 });
          
          const cardWrapper = document.createElement('div');
          cardWrapper.className = 'page-preview-card';
          
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          cardWrapper.appendChild(canvas);
          previewArea.appendChild(cardWrapper);

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        compressBtn.disabled = false;
        statusText.textContent = 'Ready to compress';
      } catch (err) {
        statusText.textContent = 'Error loading PDF';
      }
    });

    // High quality compression preserving resolution
    async function processCompression(targetBytes) {
      const { jsPDF } = window.jspdf;
      let minQuality = 0.1;
      let maxQuality = 0.95;
      let bestBlob = null;
      let bestImages = [];

      // Maintain resolution scale = 2.0 to avoid blur
      const scale = 2.0; 

      for (let attempt = 0; attempt < 6; attempt++) {
        let quality = (minQuality + maxQuality) / 2;
        let newPdf = null;
        let currentImages = [];

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          const imgData = canvas.toDataURL('image/jpeg', quality);

          if (pageNum <= 5) currentImages.push(imgData);

          const orientation = viewport.width > viewport.height ? 'l' : 'p';
          if (!newPdf) {
            newPdf = new jsPDF({ orientation: orientation, unit: 'px', format: [viewport.width, viewport.height] });
          } else {
            newPdf.addPage([viewport.width, viewport.height], orientation);
          }
          newPdf.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
        }

        let pdfBuffer = newPdf.output('arraybuffer');

        if (pdfBuffer.byteLength <= targetBytes) {
          bestBlob = new Blob([pdfBuffer], { type: 'application/pdf' });
          bestImages = currentImages;
          minQuality = quality; // Try higher quality
        } else {
          maxQuality = quality; // Lower quality
        }
      }

      return { blob: bestBlob, images: bestImages };
    }

    compressBtn.addEventListener('click', async () => {
      if (!pdfDoc || !currentFile) return;

      const targetVal = parseFloat(targetSizeInput.value);
      const unit = unitSelect.value;
      const targetBytes = Math.floor(unit === 'MB' ? targetVal * 1024 * 1024 : targetVal * 1024);

      if (targetBytes >= currentFile.size) {
        alert('Target size original size se chhota hona chahiye!');
        return;
      }

      compressBtn.disabled = true;
      statusText.textContent = 'Compressing while preserving high quality...';

      try {
        const result = await processCompression(targetBytes);
        
        if (result.blob) {
          compressedPdfBlob = result.blob;
          
          // Render full size compressed preview
          previewArea.innerHTML = '';
          result.images.forEach(dataUrl => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'page-preview-card';
            const img = document.createElement('img');
            img.src = dataUrl;
            cardWrapper.appendChild(img);
            previewArea.appendChild(cardWrapper);
          });

          compressedSizeText.textContent = formatBytes(compressedPdfBlob.size);
          resultRow.style.display = 'flex';
          downloadBtn.style.display = 'block';
          statusText.textContent = 'Compression complete!';
        } else {
          statusText.textContent = 'Could not reach target size without losing image clarity.';
        }
      } catch (err) {
        statusText.textContent = 'Compression error occurred.';
      } finally {
        compressBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!compressedPdfBlob) return;
      const url = URL.createObjectURL(compressedPdfBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'compressed_' + currentFile.name;
      link.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
