<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Resizer Pro - Cyber Cafe Tools</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #FF6FA5;
      --accent-hover: #ff5292;
      --accent-glow: rgba(255, 111, 165, 0.35);
      --bg-dark: #0B0E17;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(0, 0, 0, 0.35);
      --text-main: #FFFFFF;
      --text-muted: #A0A5B5;
      --success: #4FD98A;
      --danger: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Ambient Background Elements */
    .background-orb-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      animation: floatOrb 22s ease-in-out infinite alternate;
    }

    .orb-primary {
      width: 380px;
      height: 380px;
      background: rgba(255, 111, 165, 0.22);
      top: -80px;
      left: -80px;
    }

    .orb-secondary {
      width: 450px;
      height: 450px;
      background: rgba(90, 169, 255, 0.18);
      bottom: -120px;
      right: -100px;
      animation-delay: -7s;
    }

    .orb-tertiary {
      width: 300px;
      height: 300px;
      background: rgba(255, 138, 80, 0.15);
      top: 35%;
      left: 45%;
      animation-delay: -14s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, 35px) scale(1.05); }
      100% { transform: translate(-20px, -25px) scale(0.95); }
    }

    /* Header Styling */
    header {
      position: relative;
      z-index: 10;
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 14, 23, 0.7);
      backdrop-filter: blur(16px);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      backdrop-filter: blur(16px);
      transition: all 0.25s ease;
    }

    .home-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.2px;
    }

    .app-title span {
      color: var(--accent);
    }

    /* Main Grid Layout */
    .main-container {
      position: relative;
      z-index: 5;
      height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px) saturate(170%);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      overflow-y: auto;
    }

    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .status-badge.active-preview {
      background: rgba(255, 111, 165, 0.18);
      color: var(--accent);
      border-color: rgba(255, 111, 165, 0.4);
    }

    /* File Upload Box */
    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      border: 2px dashed rgba(255, 111, 165, 0.35);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.015);
      cursor: pointer;
      text-align: center;
      transition: all 0.25s ease;
    }

    .file-input-wrapper:hover {
      border-color: var(--accent);
      background: rgba(255, 111, 165, 0.04);
      transform: translateY(-1px);
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      width: 42px;
      height: 42px;
      fill: var(--accent);
      margin-bottom: 10px;
      transition: transform 0.25s ease;
    }

    .file-input-wrapper:hover .upload-icon {
      transform: scale(1.08);
    }

    .upload-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-all;
    }

    .upload-subtext {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Input Controls */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .target-size-row {
      display: flex;
      gap: 12px;
    }

    .text-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #FFF;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .text-input:focus {
      border-color: var(--accent);
    }

    .unit-select {
      width: 90px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 10px;
      color: #FFF;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .unit-select option {
      background: #151928;
      color: #FFF;
    }

    /* Information Box */
    .file-info-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.86rem;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-val {
      font-weight: 600;
    }

    /* Buttons */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0B0E17;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-success {
      background: var(--success);
      color: #0B0E17;
    }

    .btn-success:hover:not(:disabled) {
      background: #3ec478;
      box-shadow: 0 0 20px rgba(79, 217, 138, 0.4);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Status Display */
    .status-text {
      font-size: 0.82rem;
      text-align: center;
      color: var(--text-muted);
      line-height: 1.4;
      min-height: 24px;
    }

    /* Right Preview Container */
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
    }

    .preview-scroll-area {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 16px 10px;
    }

    /* Preview Canvas and Image Container Fix */
    .page-preview-card {
      width: 100%;
      max-width: 780px;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .page-preview-card canvas, 
    .page-preview-card img {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: contain;
    }

    .placeholder-msg {
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .placeholder-icon {
      width: 48px;
      height: 48px;
      fill: rgba(255, 255, 255, 0.2);
    }

    /* Responsive Adjustments */
    @media (max-height: 720px), (max-width: 900px) {
      html, body {
        overflow: auto;
        height: auto;
      }
      .main-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .preview-panel {
        min-height: 500px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Orb Background -->
  <div class="background-orb-layer">
    <div class="orb orb-primary"></div>
    <div class="orb orb-secondary"></div>
    <div class="orb orb-tertiary"></div>
  </div>

  <!-- Header Navigation -->
  <header>
    <a href="../index.html" class="home-btn">← Home</a>
    <div class="app-title">PDF <span>Resizer Pro</span></div>
  </header>

  <!-- Application Body -->
  <div class="main-container">
    
    <!-- Left Operations Panel -->
    <div class="glass-panel">
      <div class="panel-header-row">
        <div class="panel-heading">Upload & Compress</div>
      </div>

      <!-- File Select Dropzone -->
      <div class="file-input-wrapper" id="dropZone">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="upload-text" id="uploadText">Select PDF File</div>
        <div class="upload-subtext">Click or drag PDF here</div>
        <input type="file" id="pdfFileInput" accept="application/pdf">
      </div>

      <!-- Target File Size Selection -->
      <div class="input-group">
        <label for="targetSizeInput">Target Maximum File Size</label>
        <div class="target-size-row">
          <input type="number" id="targetSizeInput" class="text-input" placeholder="e.g. 200" value="200" min="1" step="any">
          <select id="unitSelect" class="unit-select">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>
      </div>

      <!-- File Statistics Display -->
      <div class="file-info-box" id="infoBox" style="display: none;">
        <div class="info-item">
          <span class="info-label">Original Size:</span>
          <span class="info-val" id="origSizeText">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Total Pages:</span>
          <span class="info-val" id="pageCountText">-</span>
        </div>
        <div class="info-item" id="resultRow" style="display: none;">
          <span class="info-label" style="color: var(--accent);">Compressed Size:</span>
          <span class="info-val" id="compressedSizeText" style="color: var(--accent);">-</span>
        </div>
      </div>

      <!-- Action Buttons Container -->
      <div class="btn-container">
        <button class="btn btn-primary" id="compressBtn" disabled>Process & Compress PDF</button>
        <button class="btn btn-success" id="downloadBtn" style="display: none;">Download Compressed PDF</button>
      </div>

      <div class="status-text" id="statusText">Select a PDF file to begin</div>
    </div>

    <!-- Right Live Preview Panel -->
    <div class="glass-panel preview-panel">
      <div class="panel-header-row" style="width: 100%; margin-bottom: 12px;">
        <div class="panel-heading">Document Preview</div>
        <div class="status-badge" id="previewBadge">Original Document</div>
      </div>
      
      <div class="preview-scroll-area" id="previewArea">
        <div class="placeholder-msg">
          <svg class="placeholder-icon" viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
          </svg>
          <span>Uploaded PDF page previews will render here</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Initialize PDF.js Engine Global Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // DOM Element Reference Selection
    const pdfFileInput = document.getElementById('pdfFileInput');
    const uploadText = document.getElementById('uploadText');
    const targetSizeInput = document.getElementById('targetSizeInput');
    const unitSelect = document.getElementById('unitSelect');
    const infoBox = document.getElementById('infoBox');
    const origSizeText = document.getElementById('origSizeText');
    const pageCountText = document.getElementById('pageCountText');
    const resultRow = document.getElementById('resultRow');
    const compressedSizeText = document.getElementById('compressedSizeText');
    const compressBtn = document.getElementById('compressBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const previewArea = document.getElementById('previewArea');
    const previewBadge = document.getElementById('previewBadge');

    // System Application State Variables
    let currentFile = null;
    let pdfDoc = null;
    let compressedPdfBlob = null;

    /**
     * Utility: Format Raw Bytes into Human Readable Units
     */
    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    /**
     * Event Listener: PDF File Selection and Initial Load
     */
    pdfFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') return;

      currentFile = file;
      uploadText.textContent = file.name;
      origSizeText.textContent = formatBytes(file.size);
      
      infoBox.style.display = 'flex';
      resultRow.style.display = 'none';
      downloadBtn.style.display = 'none';
      compressBtn.disabled = true;
      compressBtn.textContent = 'Process & Compress PDF';
      statusText.textContent = 'Rendering original PDF preview...';
      
      previewBadge.textContent = "Original Document";
      previewBadge.classList.remove("active-preview");

      try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        pageCountText.textContent = pdfDoc.numPages;

        previewArea.innerHTML = '';
        
        // Render up to 5 initial pages in High Resolution
        for (let pageNum = 1; pageNum <= Math.min(pdfDoc.numPages, 5); pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          
          // High DPI Scale calculation to prevent blur
          const scale = 2.0; 
          const viewport = page.getViewport({ scale: scale });
          
          const cardWrapper = document.createElement('div');
          cardWrapper.className = 'page-preview-card';
          
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d', { alpha: false });
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          cardWrapper.appendChild(canvas);
          previewArea.appendChild(cardWrapper);

          await page.render({ 
            canvasContext: context, 
            viewport: viewport 
          }).promise;
        }

        compressBtn.disabled = false;
        statusText.textContent = 'Original loaded. Ready to compress.';
      } catch (err) {
        console.error("Error loading PDF:", err);
        statusText.textContent = 'Failed to load PDF document.';
      }
    });

    /**
     * Core Render Engine: Generates High-Resolution PDF pages with Adaptive Quality
     */
    async function renderAndBuildPdf(renderScale, imageQuality) {
      const { jsPDF } = window.jspdf;
      let newPdf = null;
      let previewImagesData = [];

      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        
        // Ensure minimum 1.5 scale to maintain high clarity
        const viewport = page.getViewport({ scale: Math.max(renderScale, 1.5) });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d', { alpha: false });

        // Enable ultra quality image smoothing
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        await page.render({ 
          canvasContext: ctx, 
          viewport: viewport 
        }).promise;

        const imgData = canvas.toDataURL('image/jpeg', imageQuality);
        
        if (pageNum <= 5) {
          previewImagesData.push(imgData);
        }

        const orientation = viewport.width > viewport.height ? 'l' : 'p';

        if (!newPdf) {
          newPdf = new jsPDF({
            orientation: orientation,
            unit: 'px',
            format: [viewport.width, viewport.height]
          });
        } else {
          newPdf.addPage([viewport.width, viewport.height], orientation);
        }

        newPdf.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height, undefined, 'FAST');
      }

      return {
        buffer: newPdf.output('arraybuffer'),
        images: previewImagesData
      };
    }

    /**
     * Exact Target Matching Byte-Injector
     */
    function injectPaddingToExactSize(pdfArrayBuffer, targetSizeBytes) {
      const currentSize = pdfArrayBuffer.byteLength;
      
      if (currentSize >= targetSizeBytes) {
        return new Blob([pdfArrayBuffer], { type: 'application/pdf' });
      }

      const diff = targetSizeBytes - currentSize;
      const prefix = "\n%PADDING-START\n%";
      const suffix = "\n%PADDING-END\n";
      const headerLength = prefix.length + suffix.length;

      let paddingByteCount = diff - headerLength;
      if (paddingByteCount < 0) paddingByteCount = 0;

      const paddingString = prefix + "0".repeat(paddingByteCount) + suffix;
      const paddingEncoder = new TextEncoder();
      const paddingBytes = paddingEncoder.encode(paddingString);

      const finalBuffer = new Uint8Array(pdfArrayBuffer.byteLength + paddingBytes.byteLength);
      finalBuffer.set(new Uint8Array(pdfArrayBuffer), 0);
      finalBuffer.set(paddingBytes, pdfArrayBuffer.byteLength);

      return new Blob([finalBuffer], { type: 'application/pdf' });
    }

    /**
     * Render Post-Compression Compressed Preview
     */
    function updateCompressedPreview(imagesData) {
      previewArea.innerHTML = '';
      imagesData.forEach((dataUrl) => {
        const cardWrapper = document.createElement('div');
        cardWrapper.className = 'page-preview-card';
        
        const img = document.createElement('img');
        img.src = dataUrl;
        
        cardWrapper.appendChild(img);
        previewArea.appendChild(cardWrapper);
      });
      
      previewBadge.textContent = "Compressed Result";
      previewBadge.classList.add("active-preview");
    }

    /**
     * Primary Compression Processing Execution
     */
    compressBtn.addEventListener('click', async () => {
      if (!pdfDoc || !currentFile) return;

      const targetValue = parseFloat(targetSizeInput.value);
      if (!targetValue || targetValue <= 0) {
        alert('Please enter a valid target size.');
        return;
      }

      const unit = unitSelect.value;
      const targetSizeBytes = Math.floor(unit === 'MB' ? targetValue * 1024 * 1024 : targetValue * 1024);

      // Validation Rule: Target size must be smaller than original file size
      if (targetSizeBytes >= currentFile.size) {
        alert(`Target size (${formatBytes(targetSizeBytes)}) original size (${formatBytes(currentFile.size)}) se chhota hona chahiye! Over-compression permitted nahi hai.`);
        statusText.textContent = 'Error: Target size must be smaller than original file size.';
        return;
      }

      compressBtn.disabled = true;
      statusText.textContent = 'Optimizing PDF image streams & quality...';

      try {
        let bestResult = null;
        
        // Quality preservation scales (Keeping viewport resolution crisp)
        const scales = [2.0, 1.8, 1.6, 1.4];

        for (let scale of scales) {
          let minQ = 0.25;
          let maxQ = 0.98;
          let scaleBest = null;

          // Precision Binary Search for optimum quality matching target
          for (let i = 0; i < 7; i++) {
            let midQ = (minQ + maxQ) / 2;
            let result = await renderAndBuildPdf(scale, midQ);
            
            if (result.buffer.byteLength <= targetSizeBytes) {
              scaleBest = result;
              minQ = midQ; // Try higher quality
            } else {
              maxQ = midQ; // Target exceeded, reduce compression level
            }
          }

          if (scaleBest) {
            bestResult = scaleBest;
            break; // Found optimum quality match
          }
        }

        // High resolution fallback for aggressive target sizes
        if (!bestResult) {
          bestResult = await renderAndBuildPdf(1.2, 0.15);
        }

        // Apply byte injection to match exact KB/MB specified
        compressedPdfBlob = injectPaddingToExactSize(bestResult.buffer, targetSizeBytes);

        // Render compressed preview without size shrink issue
        updateCompressedPreview(bestResult.images);

        compressedSizeText.textContent = formatBytes(compressedPdfBlob.size);
        resultRow.style.display = 'flex';

        compressBtn.disabled = false;
        compressBtn.textContent = 'Re-Process PDF';
        downloadBtn.style.display = 'flex';
        statusText.textContent = 'Compression Complete! High clarity preserved.';
      } catch (err) {
        console.error("Compression processing error:", err);
        statusText.textContent = 'Error while compressing PDF.';
        compressBtn.disabled = false;
      }
    });

    /**
     * File Download Execution Handler
     */
    downloadBtn.addEventListener('click', () => {
      if (!compressedPdfBlob) return;
      const url = URL.createObjectURL(compressedPdfBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = currentFile ? 'compressed_' + currentFile.name : 'compressed.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
