<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Resizer & Compressor - Target KB/MB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #00F0FF;
      --accent-hover: #00C8D6;
      --bg-dark: #07090E;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -50px; left: -50px; }
    .orb-2 { width: 350px; height: 350px; background: rgba(138, 43, 226, 0.15); bottom: -50px; right: -50px; }

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(7, 9, 14, 0.6);
      backdrop-filter: blur(12px);
    }
    .app-title { font-size: 1.1rem; font-weight: 700; }
    .app-title span { color: var(--accent); }

    .main-layout {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .glass-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-box {
      border: 2px dashed var(--panel-border);
      border-radius: 10px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      position: relative;
      transition: all 0.3s ease;
    }
    .upload-box:hover {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.04);
    }
    .upload-box input {
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      opacity: 0; cursor: pointer;
    }
    .upload-label { font-size: 0.9rem; font-weight: 600; }
    .upload-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .target-input-group {
      display: flex;
      gap: 8px;
    }

    input[type="number"], select {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="number"] {
      flex: 1;
    }

    select {
      width: 90px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: rgba(255,255,255,0.2); color: #888; cursor: not-allowed; }

    .preview-stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .image-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .image-card img {
      max-width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 6px;
    }

    .info-badge {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 20px;
      color: var(--text-muted);
      width: 100%;
      text-align: center;
    }
    .info-badge span { color: #fff; font-weight: 600; }

    .status-msg {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
    }

    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; }
      .preview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header>
    <div class="app-title">JPG Photo <span>Compressor Studio</span></div>
  </header>

  <div class="main-layout">
    
    <!-- Controls Panel -->
    <div class="glass-card">
      <div class="section-title">1. Upload Photo</div>
      <div class="upload-box" onclick="document.getElementById('imageInput').click()">
        <div class="upload-label">Select Photo</div>
        <div class="upload-sub" id="uploadStatus">Click or Drag Image Here</div>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="section-title" style="margin-top: 8px;">2. Target File Size</div>
      <div class="target-input-group">
        <input type="number" id="targetSizeInput" placeholder="Enter size (e.g. 50)" value="50" min="1">
        <select id="unitSelect">
          <option value="KB" selected>KB</option>
          <option value="MB">MB</option>
        </select>
      </div>

      <button class="btn btn-primary" id="compressBtn" style="margin-top: 8px;" disabled>Compress Photo</button>

      <div class="status-msg" id="statusMsg">Upload photo to start</div>

      <button class="btn btn-primary" id="downloadBtn" style="margin-top: auto;" disabled>Download JPG Photo</button>
    </div>

    <!-- Preview Panel -->
    <div class="preview-stage">
      <div class="preview-grid">
        
        <div class="image-card">
          <div class="section-title">Original Photo</div>
          <img id="originalImg" src="" style="display:none;" alt="Original">
          <div class="info-badge" id="origInfo">Size: <span>0 KB</span></div>
        </div>

        <div class="image-card">
          <div class="section-title">Compressed Preview (JPG)</div>
          <img id="compressedImg" src="" style="display:none;" alt="Compressed">
          <div class="info-badge" id="compInfo">Size: <span>0 KB</span></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const targetSizeInput = document.getElementById('targetSizeInput');
    const unitSelect = document.getElementById('unitSelect');
    const compressBtn = document.getElementById('compressBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');

    const originalImg = document.getElementById('originalImg');
    const compressedImg = document.getElementById('compressedImg');
    const origInfo = document.getElementById('origInfo');
    const compInfo = document.getElementById('compInfo');

    let loadedImage = null;
    let originalFileSize = 0;
    let compressedDataUrl = '';

    function formatBytes(bytes) {
      if (bytes === 0) return '0 KB';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalFileSize = file.size;
      uploadStatus.innerText = file.name;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          originalImg.src = event.target.result;
          originalImg.style.display = 'block';
          origInfo.innerHTML = `Size: <span>${formatBytes(originalFileSize)}</span> (${img.width}x${img.height})`;

          compressBtn.disabled = false;
          statusMsg.innerText = 'Ready to compress';
          processAutoCompression();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    compressBtn.addEventListener('click', () => {
      processAutoCompression();
    });

    function processAutoCompression() {
      if (!loadedImage) return;

      const targetVal = parseFloat(targetSizeInput.value) || 50;
      const unit = unitSelect.value;
      const targetSizeBytes = unit === 'MB' ? targetVal * 1024 * 1024 : targetVal * 1024;

      statusMsg.innerText = 'Compressing...';

      let minQuality = 0.01;
      let maxQuality = 1.0;
      let bestResult = null;
      let currentScale = 1.0;

      // First try quality reduction using Binary Search
      for (let attempt = 0; attempt < 2; attempt++) {
        minQuality = 0.01;
        maxQuality = 1.0;

        for (let i = 0; i < 8; i++) {
          const midQuality = (minQuality + maxQuality) / 2;
          const result = renderToJpg(loadedImage, currentScale, midQuality);

          if (result.size <= targetSizeBytes) {
            bestResult = result;
            minQuality = midQuality; // try higher quality if possible
          } else {
            maxQuality = midQuality; // lower quality needed
          }
        }

        // If target size reached, stop
        if (bestResult) break;

        // If even lowest quality is larger than target, downscale image dimensions
        currentScale *= 0.75;
      }

      // If still no result, render at lowest settings
      if (!bestResult) {
        bestResult = renderToJpg(loadedImage, 0.5, 0.05);
      }

      compressedDataUrl = bestResult.dataUrl;
      compressedImg.src = compressedDataUrl;
      compressedImg.style.display = 'block';

      compInfo.innerHTML = `Size: <span>${formatBytes(bestResult.size)}</span> (${bestResult.width}x${bestResult.height})`;
      statusMsg.innerText = `Compressed under ${targetVal} ${unit}!`;

      downloadBtn.disabled = false;
    }

    function renderToJpg(img, scale, quality) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const width = Math.max(10, Math.round(img.width * scale));
      const height = Math.max(10, Math.round(img.height * scale));

      canvas.width = width;
      canvas.height = height;

      // Fill white background for JPG (PNG transparency handle)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const head = 'data:image/jpeg;base64,';
      const size = Math.round((dataUrl.length - head.length) * 3 / 4);

      return { dataUrl, size, width, height };
    }

    downloadBtn.addEventListener('click', () => {
      if (!compressedDataUrl) return;

      const link = document.createElement('a');
      link.download = 'compressed_photo.jpg';
      link.href = compressedDataUrl;
      link.click();
    });
  </script>
</body>
</html>
