<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG Resizer & Compressor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0D14;
      --panel-bg: rgba(22, 27, 38, 0.7);
      --panel-border: rgba(255, 255, 255, 0.08);
      --pink-primary: #D84B72;
      --pink-hover: #E85B82;
      --pink-muted: rgba(216, 75, 114, 0.15);
      --pink-dashed: #8A3A52;
      --text-main: #FFFFFF;
      --text-muted: #8A92A6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Ambient Background Glows */
    .glow-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(216, 75, 114, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 10%;
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(30, 60, 110, 0.18) 0%, rgba(0,0,0,0) 70%);
      bottom: 5%;
      right: 10%;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(10, 13, 20, 0.8);
      backdrop-filter: blur(12px);
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .app-title span {
      color: var(--pink-primary);
    }

    .main-layout {
      position: relative;
      z-index: 5;
      height: calc(100vh - 60px);
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
    }

    .left-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-heading {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--pink-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-box {
      border: 1.5px dashed var(--pink-dashed);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      background: var(--pink-muted);
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .upload-box:hover {
      border-color: var(--pink-primary);
      background: rgba(216, 75, 114, 0.22);
    }
    .upload-box input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon {
      width: 32px;
      height: 32px;
      fill: var(--pink-primary);
    }
    .upload-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #FFFFFF;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .target-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="number"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    select {
      width: 80px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      background: var(--pink-primary);
      color: #FFFFFF;
    }
    .btn-action:hover {
      background: var(--pink-hover);
    }
    .btn-action:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .status-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: -5px;
    }

    /* Right Preview Stage */
    .right-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .badge-view {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    .preview-card {
      background: rgba(10, 13, 20, 0.5);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .preview-card img {
      max-width: 100%;
      max-height: calc(100vh - 280px);
      object-fit: contain;
      border-radius: 6px;
    }

    .info-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 20px;
      width: 100%;
      text-align: center;
    }
    .info-tag span {
      color: #FFF;
      font-weight: 600;
    }

    @media (max-width: 850px) {
      body { overflow: auto; }
      .main-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .preview-container {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <header>
    <button class="btn-home">&larr; Home</button>
    <div class="app-title">JPG <span>Resizer</span></div>
  </header>

  <div class="main-layout">
    
    <!-- Left Sidebar Panel -->
    <div class="left-panel">
      <div class="panel-heading">Upload & Resize</div>

      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="upload-label" id="fileStatus">Select Image File</div>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div class="form-group">
        <div class="form-label">Exact Target File Size</div>
        <div class="target-input-row">
          <input type="number" id="targetSize" value="200" min="1">
          <select id="sizeUnit">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>
      </div>

      <button class="btn-action" id="processBtn" disabled>Process Image</button>

      <div class="status-note" id="statusNote">Upload an Image to get started</div>

      <button class="btn-action" id="downloadBtn" style="margin-top: auto; display: none;">Download JPG</button>
    </div>

    <!-- Right Workspace / Preview Panel -->
    <div class="right-panel">
      <div class="preview-header">
        <div class="panel-heading">Image Preview</div>
        <div class="badge-view">Original vs Compressed</div>
      </div>

      <div class="preview-container" id="previewContainer">
        <div class="placeholder-text" id="placeholderText">Image preview will appear here</div>

        <div class="preview-grid" id="previewGrid" style="display: none;">
          <div class="preview-card">
            <div class="form-label">Original Image</div>
            <img id="origImg" src="" alt="Original">
            <div class="info-tag" id="origInfo">Size: <span>0 KB</span></div>
          </div>

          <div class="preview-card">
            <div class="form-label">Compressed Preview</div>
            <img id="compImg" src="" alt="Compressed">
            <div class="info-tag" id="compInfo">Size: <span>0 KB</span></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const targetSize = document.getElementById('targetSize');
    const sizeUnit = document.getElementById('sizeUnit');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusNote = document.getElementById('statusNote');

    const placeholderText = document.getElementById('placeholderText');
    const previewGrid = document.getElementById('previewGrid');
    const origImg = document.getElementById('origImg');
    const compImg = document.getElementById('compImg');
    const origInfo = document.getElementById('origInfo');
    const compInfo = document.getElementById('compInfo');

    let loadedImage = null;
    let originalSizeBytes = 0;
    let finalCompressedDataUrl = '';

    function formatBytes(bytes) {
      if (bytes === 0) return '0 KB';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalSizeBytes = file.size;
      fileStatus.innerText = file.name;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          origImg.src = evt.target.result;
          origInfo.innerHTML = `Size: <span>${formatBytes(originalSizeBytes)}</span> (${img.width}x${img.height})`;

          placeholderText.style.display = 'none';
          previewGrid.style.display = 'grid';

          processBtn.disabled = false;
          statusNote.innerText = 'Ready to process';
          
          runCompression();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    processBtn.addEventListener('click', runCompression);

    function runCompression() {
      if (!loadedImage) return;

      const targetVal = parseFloat(targetSize.value) || 200;
      const unit = sizeUnit.value;
      const maxBytes = unit === 'MB' ? targetVal * 1024 * 1024 : targetVal * 1024;

      statusNote.innerText = 'Processing...';

      let minQuality = 0.01;
      let maxQuality = 1.0;
      let bestResult = null;
      let scale = 1.0;

      // Quality adjustment loop
      for (let pass = 0; pass < 2; pass++) {
        minQuality = 0.01;
        maxQuality = 1.0;

        for (let i = 0; i < 8; i++) {
          const midQuality = (minQuality + maxQuality) / 2;
          const res = renderJpg(loadedImage, scale, midQuality);

          if (res.size <= maxBytes) {
            bestResult = res;
            minQuality = midQuality;
          } else {
            maxQuality = midQuality;
          }
        }

        if (bestResult) break;
        scale *= 0.75; // Downscale dimensions if file is still too big
      }

      if (!bestResult) {
        bestResult = renderJpg(loadedImage, 0.4, 0.05);
      }

      finalCompressedDataUrl = bestResult.dataUrl;
      compImg.src = finalCompressedDataUrl;
      compInfo.innerHTML = `Size: <span>${formatBytes(bestResult.size)}</span> (${bestResult.width}x${bestResult.height})`;

      statusNote.innerText = `Compressed under ${targetVal} ${unit}!`;
      downloadBtn.style.display = 'block';
    }

    function renderJpg(img, scale, quality) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const width = Math.max(10, Math.round(img.width * scale));
      const height = Math.max(10, Math.round(img.height * scale));

      canvas.width = width;
      canvas.height = height;

      // Solid White Canvas Background for JPG
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const head = 'data:image/jpeg;base64,';
      const size = Math.round((dataUrl.length - head.length) * 3 / 4);

      return { dataUrl, size, width, height };
    }

    downloadBtn.addEventListener('click', () => {
      if (!finalCompressedDataUrl) return;
      const link = document.createElement('a');
      link.download = 'resized_photo.jpg';
      link.href = finalCompressedDataUrl;
      link.click();
    });
  </script>
</body>
</html>
