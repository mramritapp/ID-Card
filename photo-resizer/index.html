<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG Photo Resizer Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0D14;
      --panel-bg: rgba(22, 27, 38, 0.7);
      --panel-border: rgba(255, 255, 255, 0.08);
      --pink-primary: #D84B72;
      --pink-hover: #E85B82;
      --pink-muted: rgba(216, 75, 114, 0.15);
      --pink-dashed: #8A3A52;
      --text-main: #FFFFFF;
      --text-muted: #8A92A6;
      --error-color: #FF4D4D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .glow-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(216, 75, 114, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 10%;
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(30, 60, 110, 0.18) 0%, rgba(0,0,0,0) 70%);
      bottom: 5%;
      right: 10%;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(10, 13, 20, 0.8);
      backdrop-filter: blur(12px);
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.2s ease;
    }
    .btn-home:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .app-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .app-title span {
      color: var(--pink-primary);
    }

    .main-layout {
      position: relative;
      z-index: 5;
      height: calc(100vh - 60px);
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .left-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .panel-heading {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--pink-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-box {
      border: 1.5px dashed var(--pink-dashed);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: var(--pink-muted);
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .upload-box:hover {
      border-color: var(--pink-primary);
      background: rgba(216, 75, 114, 0.22);
    }
    .upload-box input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon {
      width: 28px;
      height: 28px;
      fill: var(--pink-primary);
    }
    .upload-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #FFFFFF;
    }

    /* Original Image Details Card */
    .orig-details-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .orig-details-title {
      font-size: 0.75rem;
      color: var(--pink-primary);
      font-weight: 700;
      text-transform: uppercase;
    }
    .orig-detail-row {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .orig-detail-row span {
      color: #FFF;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .target-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="number"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    select {
      width: 80px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      background: var(--pink-primary);
      color: #FFFFFF;
    }
    .btn-action:hover {
      background: var(--pink-hover);
    }
    .btn-action:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 0.78rem;
      text-align: center;
      min-height: 18px;
      font-weight: 500;
    }
    .status-msg.error {
      color: var(--error-color);
    }
    .status-msg.success {
      color: #4DEEEA;
    }

    /* Right Preview Stage */
    .right-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .badge-view {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .preview-display {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .preview-display img {
      max-width: 100%;
      max-height: calc(100vh - 220px);
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @media (max-width: 850px) {
      body { overflow: auto; }
      .main-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .preview-container {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <header>
    <button class="btn-home" id="btnHome">&larr; Home</button>
    <div class="app-title">JPG <span>Resizer Studio</span></div>
  </header>

  <div class="main-layout">
    
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="panel-heading">Upload & Resize</div>

      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="upload-label" id="fileStatus">Select Image File</div>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <!-- Original Image Details Card -->
      <div class="orig-details-card" id="origDetailsCard">
        <div class="orig-details-title">Original Image Details</div>
        <div class="orig-detail-row">File Name: <span id="origName">-</span></div>
        <div class="orig-detail-row">Original Size: <span id="origSize">-</span></div>
        <div class="orig-detail-row">Dimensions: <span id="origDim">-</span></div>
      </div>

      <div class="form-group">
        <div class="form-label">Exact Target File Size</div>
        <div class="target-input-row">
          <input type="number" id="targetSize" placeholder="e.g. 50" min="1">
          <select id="sizeUnit">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>
      </div>

      <button class="btn-action" id="processBtn" disabled>Process Image</button>

      <div class="status-msg" id="statusMsg"></div>

      <button class="btn-action" id="downloadBtn" style="margin-top: auto; display: none;">Download JPG</button>
    </div>

    <!-- Right Workspace Panel -->
    <div class="right-panel">
      <div class="preview-header">
        <div class="panel-heading">Image Preview</div>
        <div class="badge-view" id="previewStateBadge">Original View</div>
      </div>

      <div class="preview-container">
        <div class="placeholder-text" id="placeholderText">Image preview will appear here</div>

        <div class="preview-display" id="previewDisplay">
          <img id="mainPreviewImg" src="" alt="Preview">
        </div>
      </div>
    </div>

  </div>

  <script>
    const btnHome = document.getElementById('btnHome');
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const origDetailsCard = document.getElementById('origDetailsCard');
    const origName = document.getElementById('origName');
    const origSize = document.getElementById('origSize');
    const origDim = document.getElementById('origDim');

    const targetSize = document.getElementById('targetSize');
    const sizeUnit = document.getElementById('sizeUnit');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');

    const placeholderText = document.getElementById('placeholderText');
    const previewDisplay = document.getElementById('previewDisplay');
    const mainPreviewImg = document.getElementById('mainPreviewImg');
    const previewStateBadge = document.getElementById('previewStateBadge');

    let loadedImage = null;
    let originalSizeBytes = 0;
    let finalCompressedDataUrl = '';

    // Home button action
    btnHome.addEventListener('click', () => {
      window.location.href = '/';
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 KB';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function resetApp() {
      loadedImage = null;
      originalSizeBytes = 0;
      finalCompressedDataUrl = '';
      
      targetSize.value = '';
      sizeUnit.value = 'KB';

      downloadBtn.style.display = 'none';
      processBtn.disabled = true;

      statusMsg.className = 'status-msg';
      statusMsg.innerText = '';

      origDetailsCard.style.display = 'none';
      previewDisplay.style.display = 'none';
      placeholderText.style.display = 'block';
      previewStateBadge.innerText = 'Original View';
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetApp();

      originalSizeBytes = file.size;
      fileStatus.innerText = 'Change Photo';

      origName.innerText = file.name.length > 20 ? file.name.substring(0, 18) + '...' : file.name;
      origSize.innerText = formatBytes(originalSizeBytes);

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          origDim.innerText = `${img.width} x ${img.height} px`;
          origDetailsCard.style.display = 'flex';

          mainPreviewImg.src = evt.target.result;
          placeholderText.style.display = 'none';
          previewDisplay.style.display = 'flex';
          previewStateBadge.innerText = 'Original View';

          processBtn.disabled = false;
          statusMsg.className = 'status-msg';
          statusMsg.innerText = 'Enter target size and click Process';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    processBtn.addEventListener('click', runCompression);

    function runCompression() {
      if (!loadedImage) return;

      const userValue = parseFloat(targetSize.value);
      const unit = sizeUnit.value;

      if (!userValue || userValue <= 0) {
        showError('Please enter a valid target size!');
        return;
      }

      const targetBytes = unit === 'MB' ? userValue * 1024 * 1024 : userValue * 1024;

      if (targetBytes >= originalSizeBytes) {
        showError(`Target size must be smaller than original size (${formatBytes(originalSizeBytes)})!`);
        return;
      }

      statusMsg.className = 'status-msg';
      statusMsg.innerText = 'Processing...';

      let minQuality = 0.01;
      let maxQuality = 0.98;
      let bestResult = null;
      let scale = 1.0;

      for (let pass = 0; pass < 2; pass++) {
        minQuality = 0.01;
        maxQuality = 0.98;

        for (let i = 0; i < 9; i++) {
          const midQuality = (minQuality + maxQuality) / 2;
          const res = renderJpg(loadedImage, scale, midQuality);

          if (res.size <= targetBytes) {
            bestResult = res;
            minQuality = midQuality;
          } else {
            maxQuality = midQuality;
          }
        }

        if (bestResult) break;
        scale *= 0.75;
      }

      if (!bestResult) {
        bestResult = renderJpg(loadedImage, 0.3, 0.05);
      }

      finalCompressedDataUrl = bestResult.dataUrl;

      mainPreviewImg.src = finalCompressedDataUrl;
      previewStateBadge.innerText = 'Compressed View';

      showSuccess(`Successfully Compressed to ${formatBytes(bestResult.size)}!`);
      downloadBtn.style.display = 'block';
    }

    function showError(msg) {
      statusMsg.className = 'status-msg error';
      statusMsg.innerText = msg;
    }

    function showSuccess(msg) {
      statusMsg.className = 'status-msg success';
      statusMsg.innerText = msg;
    }

    function renderJpg(img, scale, quality) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const width = Math.max(10, Math.round(img.width * scale));
      const height = Math.max(10, Math.round(img.height * scale));

      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const head = 'data:image/jpeg;base64,';
      const size = Math.round((dataUrl.length - head.length) * 3 / 4);

      return { dataUrl, size, width, height };
    }

    downloadBtn.addEventListener('click', () => {
      if (!finalCompressedDataUrl) return;
      const link = document.createElement('a');
      link.download = 'compressed_photo.jpg';
      link.href = finalCompressedDataUrl;
      link.click();
    });
  </script>
</body>
</html>
